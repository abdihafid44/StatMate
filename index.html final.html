<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatMate — University of Hargeisa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .nav-active { color: #185FA5; border-bottom: 2.5px solid #185FA5; }
        .sem-active { background-color: #e6f1fb; color: #185FA5; font-weight: 600; }
        .sidebar-border { border-right: 0.5px solid #f1f1f1; }
        .tab-btn { transition: all 0.2s ease; border-bottom: 2.5px solid transparent; }
        iframe { border-radius: 12px; border: 1px solid #e5e7eb; }
        
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="px-10 pt-8 bg-white border-b border-gray-50">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-10 h-10 bg-[#185FA5] rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-sm">S</div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">StatMate <span class="text-gray-400 font-normal text-sm ml-2">· University of Hargeisa</span></h1>
            </div>
        </div>

        <nav class="flex gap-12 overflow-x-auto">
            <button onclick="showTab('library')" id="btn-library" class="tab-btn pb-3 text-[15px] font-medium text-gray-500 hover:text-[#185FA5] nav-active">Library</button>
            <button onclick="showTab('viewer')" id="btn-viewer" class="tab-btn pb-3 text-[15px] font-medium text-gray-500 hover:text-[#185FA5]">Document Viewer</button>
            <button onclick="showTab('ai')" id="btn-ai" class="tab-btn pb-3 text-[15px] font-medium text-gray-500 hover:text-[#185FA5]">AI Assistant</button>
            <button onclick="showTab('calc')" id="btn-calc" class="tab-btn pb-3 text-[15px] font-medium text-gray-500 hover:text-[#185FA5]">Calculator</button>
            <button onclick="showTab('tables')" id="btn-tables" class="tab-btn pb-3 text-[15px] font-medium text-gray-500 hover:text-[#185FA5]">Stat Tables</button>
        </nav>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-72 p-10 sidebar-border overflow-y-auto hidden md:block">
            <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-6">Semesters</h3>
            <div class="flex flex-col gap-1" id="sem-nav">
                </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-12 bg-slate-50/30">
            
            <div id="tab-library" class="tab-content">
                <div class="max-w-4xl">
                    <div id="library-main">
                        <div class="flex items-center justify-between mb-8">
                            <h2 class="text-2xl font-semibold text-slate-800" id="current-sem-title">Semester 6 — Courses</h2>
                            <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm text-gray-400">
                                <i class="ti ti-search text-lg"></i>
                                <input type="text" id="file-search" placeholder="Search resources..." class="bg-transparent border-none outline-none text-sm w-48 text-slate-700" oninput="filterFiles()">
                            </div>
                        </div>
                        <div id="course-grid" class="space-y-10">
                            </div>
                    </div>
                </div>
            </div>

            <div id="tab-viewer" class="tab-content hidden h-full">
                <div id="reader-frame" class="w-full h-full flex flex-col items-center justify-center bg-white border border-slate-100 shadow-sm rounded-2xl text-gray-400">
                    <i class="ti ti-file-search text-5xl mb-4 opacity-20"></i>
                    <p>Select a lecture from the Library to begin</p>
                </div>
            </div>

            <div id="tab-ai" class="tab-content hidden max-w-3xl mx-auto h-full flex flex-col">
                <div class="flex-1 bg-white border border-gray-100 rounded-3xl shadow-sm flex flex-col overflow-hidden h-[600px]">
                    <div id="ai-messages" class="flex-1 p-8 overflow-y-auto space-y-6 bg-slate-50/50">
                        <div class="flex gap-4">
                            <div class="w-8 h-8 bg-[#185FA5] rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0">SM</div>
                            <div class="bg-white border border-gray-100 p-5 rounded-2xl rounded-tl-none text-sm text-gray-700 shadow-sm leading-relaxed">
                                Hello Abdihafid! I'm your AI teaching assistant. How can I help you with your coursework or data science concepts today?
                            </div>
                        </div>
                    </div>
                    <div class="p-5 border-t border-gray-50 flex gap-4 bg-white">
                        <input type="text" id="ai-input" placeholder="Ask a statistics question..." class="flex-1 py-3 px-5 outline-none text-sm bg-gray-50 border border-gray-100 rounded-xl focus:border-[#185FA5] transition-colors" onkeydown="if(event.key==='Enter')sendChat()">
                        <button onclick="sendChat()" class="bg-[#185FA5] hover:bg-blue-700 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md transition-colors"><i class="ti ti-send"></i></button>
                    </div>
                </div>
            </div>

            <div id="tab-calc" class="tab-content hidden max-w-md mx-auto">
                <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl">
                    <div class="text-right mb-6 px-2">
                        <div id="calc-expr" class="text-slate-500 text-xs h-4 mb-1 font-mono"></div>
                        <div id="calc-display" class="text-5xl font-light text-white overflow-hidden">0</div>
                    </div>
                    <div class="grid grid-cols-4 gap-3">
                        <button class="calc-btn text-red-400 font-bold p-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 border-none" onclick="calcClear()">AC</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800 border-slate-700 hover:bg-slate-700" onclick="calcOp('/')">÷</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800 border-slate-700 hover:bg-slate-700" onclick="calcOp('*')">×</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800 border-slate-700 hover:bg-slate-700" onclick="calcOp('-')">−</button>
                        
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('7')">7</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('8')">8</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('9')">9</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800 border-slate-700 hover:bg-slate-700" onclick="calcOp('+')">+</button>
                        
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('4')">4</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('5')">5</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('6')">6</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-[#185FA5] hover:bg-blue-600 border-none row-span-2 font-bold text-xl shadow-lg" onclick="calcEquals()">=</button>
                        
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('1')">1</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('2')">2</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('3')">3</button>
                        
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700 col-span-2" onclick="calcNum('0')">0</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800/50 border-none hover:bg-slate-700" onclick="calcNum('.')">.</button>
                    </div>
                </div>
            </div>

            <div id="tab-tables" class="tab-content hidden max-w-xl mx-auto">
                <div class="bg-white border border-gray-100 shadow-sm p-10 rounded-3xl">
                    <h3 class="text-center font-bold text-xl text-slate-800 mb-8">Distribution Lookup</h3>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-2">Test Type</label>
                            <select id="dist-type" class="w-full p-4 rounded-xl border border-gray-200 outline-none text-sm focus:border-[#185FA5] transition-colors">
                                <option value="z">Z-Normal (Two-tailed)</option>
                                <option value="t">T-Student</option>
                                <option value="f">F-Snedecor</option>
                            </select>
                        </div>
                        <button onclick="calcDist()" class="w-full bg-[#185FA5] hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-md transition-colors">Find Critical Value</button>
                        <div id="dist-result" class="text-center text-5xl font-black text-[#185FA5] mt-8 tracking-tight"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

   <script>
        // --- 1. SYSTEM CONFIGURATION ---
        const SUPA_URL = 'https://dedyworlrfalwoujwkyx.supabase.co';
        const SUPA_KEY = 'sb_publishable_iqOfs6uyLmIV7PSmuOdHuQ_IXe_Fc88';
        const BUCKET = 'course-materials';
        const GEMINI_KEY = 'AIzaSyDtZVpDaz54wVBAjZnHCnO_-Ex8b9q5bCE';

        // Curriculum mapping
        const CURRICULUM = {
            1: ["Introduction to Statistics", "Calculus I", "Computer Fundamentals", "Academic Writing"],
            2: ["Probability Theory", "Calculus II", "Linear Algebra I", "Research Methods"],
            3: ["Statistical Inference", "Calculus III", "Linear Algebra II", "Data Structures"],
            4: ["Regression Analysis", "Mathematical Statistics", "Database Systems", "SPSS & R"],
            5: ["Multivariate Analysis", "Sampling Methods", "GIS & Spatial Data", "Econometrics"],
            6: ["Biostatistics", "Data Computing R", "Data Stuctures & Algorithm", "Experimental Design", "Research Methodology", "Time Series"],
            7: ["Advanced Inference", "Survey Methods", "Data Visualization", "Thesis Proposal"],
            8: ["Capstone Project", "Advanced ML", "Professional Ethics", "Final Thesis"]
        };

        // --- 2. UI & NAVIGATION ---
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('btn-' + id).classList.add('nav-active');
        }

        function setSemester(num) {
            document.querySelectorAll('#sem-nav button').forEach(b => b.classList.remove('sem-active'));
            document.getElementById('sem-' + num).classList.add('sem-active');
            document.getElementById('current-sem-title').innerText = `Semester ${num} — Courses`;
            renderCourses(num);
        }

        // --- 3. SUPABASE LIBRARY LOGIC ---
        async function renderCourses(semNum) {
            const grid = document.getElementById('course-grid');
            grid.innerHTML = '<div class="text-gray-400 italic animate-pulse">Syncing library with Supabase...</div>';
            
            const files = await fetchFiles(semNum);
            const semesterCourses = CURRICULUM[semNum] || ["General Materials"];

            grid.innerHTML = semesterCourses.map(course => {
                // BUG FIX 1: Force the code to only look for files INSIDE the folder by checking for the slash
                const coursePrefix = course.toLowerCase() + '/';
                const courseFiles = files.filter(f => 
                    f.name.toLowerCase().startsWith(coursePrefix) && 
                    !f.name.includes('.emptyFolder')
                );
                
                return `
                    <div class="group bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-50 text-[#185FA5] rounded-xl flex items-center justify-center group-hover:bg-[#185FA5] group-hover:text-white transition-colors">
                                    <i class="ti ti-book-2 text-lg"></i>
                                </div>
                                <h3 class="font-bold text-slate-800">${course}</h3>
                            </div>
                            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider bg-gray-50 px-2 py-1 rounded-md">${courseFiles.length} files</span>
                        </div>
                        <div class="space-y-1">
                            ${courseFiles.length > 0 ? courseFiles.map(f => {
                                // BUG FIX 2: Ensure the "Semester X/" part is included in the final web link
                                const fullPath = 'Semester ' + semNum + '/' + f.name;
                                const safePathArg = fullPath.replace(/'/g, "\\'");
                                
                                return `
                                <div onclick="openReader('${safePathArg}')" class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-50 cursor-pointer group/item transition-all border border-transparent hover:border-slate-200">
                                    <div class="flex items-center gap-3">
                                        <i class="ti ti-file-text text-[#185FA5] text-lg"></i>
                                        <span class="text-sm text-slate-700 font-medium truncate max-w-[250px]">${f.name.split('/').pop()}</span>
                                    </div>
                                    <i class="ti ti-chevron-right text-gray-300 opacity-0 group-hover/item:opacity-100 transition-all"></i>
                                </div>
                                `
                            }).join('') : '<p class="text-[11px] text-gray-400 italic px-3 py-2 bg-gray-50/50 rounded-lg">No resources uploaded to this folder yet.</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchFiles(semNum) {
            try {
                const r = await fetch(`${SUPA_URL}/storage/v1/object/list/${BUCKET}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prefix: `Semester ${semNum}/`, limit: 100 })
                });
                return await r.json();
            } catch (e) { 
                console.error("Supabase Error:", e);
                return []; 
            }
        }

        function openReader(filePath) {
            // Encode the path to handle spaces in folder or file names correctly
            const safePath = filePath.split('/').map(encodeURIComponent).join('/');
            const url = `${SUPA_URL}/storage/v1/object/public/${BUCKET}/${safePath}`;
            
            document.getElementById('reader-frame').innerHTML = `<iframe src="${url}" class="w-full h-full rounded-2xl"></iframe>`;
            showTab('viewer');
        }

        // --- 4. BUILD SIDEBAR MENU ---
        const nav = document.getElementById('sem-nav');
        for(let i=1; i<=8; i++) {
            const btn = document.createElement('button');
            btn.id = `sem-${i}`;
            btn.className = "text-left px-4 py-3 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors";
            btn.innerText = `Semester ${i}`;
            btn.onclick = () => setSemester(i);
            nav.appendChild(btn);
        }

        // --- 5. AI ASSISTANT (GEMINI) ---
        async function sendChat() {
            const input = document.getElementById('ai-input');
            const box = document.getElementById('ai-messages');
            if(!input.value.trim()) return;

            const text = input.value;
            input.value = '';
            
            box.innerHTML += `
                <div class="flex gap-4 justify-end">
                    <div class="bg-[#185FA5] text-white p-5 rounded-2xl rounded-tr-none text-sm max-w-[85%] shadow-sm leading-relaxed">${text}</div>
                </div>`;
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "You are a statistics tutor. Explain this clearly: " + text }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                box.innerHTML += `
                    <div class="flex gap-4">
                        <div class="w-8 h-8 bg-blue-50 text-[#185FA5] rounded-lg flex items-center justify-center text-xs font-bold shrink-0 border border-blue-100">SM</div>
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl rounded-tl-none text-sm text-gray-700 shadow-sm leading-relaxed">${reply}</div>
                    </div>`;
                box.scrollTop = box.scrollHeight;
            } catch (e) { 
                box.innerHTML += `<div class="text-red-400 text-xs text-center italic mt-2">Network error. Please check your connection.</div>`; 
            }
        }

        // --- 6. CALCULATOR ENGINE ---
        let expr = '';
        function calcNum(n) { expr += n; updateCalc(); }
        function calcOp(o) { expr += o; updateCalc(); }
        function calcClear() { expr = ''; updateCalc(); }
        function updateCalc() { document.getElementById('calc-display').innerText = expr || '0'; }
        function calcEquals() { 
            try { 
                expr = eval(expr).toString(); 
                updateCalc(); 
            } catch(e) { 
                expr = 'Error'; 
                updateCalc(); 
                expr = ''; 
            } 
        }

        // --- 7. STAT TABLES PLACEHOLDER ---
        function calcDist() { 
            const type = document.getElementById('dist-type').value;
            let result = '1.960';
            if(type === 't') result = '2.262';
            if(type === 'f') result = '3.49';
            document.getElementById('dist-result').innerText = result; 
        }

        // --- 8. INITIALIZE APP ---
        setSemester(6); 
    </script>
</body>
</html>
