<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatMate — University of Hargeisa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .nav-active { color: #185FA5; border-bottom: 2.5px solid #185FA5; }
        .sem-active { background-color: #e6f1fb; color: #185FA5; font-weight: 600; }
        .sidebar-border { border-right: 0.5px solid #f1f1f1; }
        .tab-btn { transition: all 0.2s ease; border-bottom: 2.5px solid transparent; }
        iframe { border-radius: 12px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="px-10 pt-8 bg-white border-b border-gray-50">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-10 h-10 bg-[#185FA5] rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-sm">S</div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">StatMate <span class="text-gray-400 font-normal text-sm ml-2">· University of Hargeisa</span></h1>
            </div>
        </div>

        <nav class="flex gap-12">
            <button onclick="showTab('library')" id="btn-library" class="tab-btn pb-3 text-[15px] text-gray-500 hover:text-[#185FA5] nav-active">Library</button>
            <button onclick="showTab('viewer')" id="btn-viewer" class="tab-btn pb-3 text-[15px] text-gray-500 hover:text-[#185FA5]">Document Viewer</button>
            <button onclick="showTab('ai')" id="btn-ai" class="tab-btn pb-3 text-[15px] text-gray-500 hover:text-[#185FA5]">AI Assistant</button>
            <button onclick="showTab('calc')" id="btn-calc" class="tab-btn pb-3 text-[15px] text-gray-500 hover:text-[#185FA5]">Calculator</button>
            <button onclick="showTab('tables')" id="btn-tables" class="tab-btn pb-3 text-[15px] text-gray-500 hover:text-[#185FA5]">Stat Tables</button>
        </nav>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-72 p-10 sidebar-border overflow-y-auto hidden md:block">
            <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-6">Semesters</h3>
            <div class="flex flex-col gap-1" id="sem-nav">
                </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-12">
            
            <div id="tab-library" class="tab-content">
                <div class="max-w-4xl">
                    <div class="flex items-center gap-2 mb-10 text-gray-400">
                        <i class="ti ti-search text-xl"></i>
                        <input type="text" id="file-search" placeholder="Search files..." class="bg-transparent border-none outline-none text-sm w-full" oninput="filterFiles()">
                    </div>

                    <div id="library-main">
                        <h2 class="text-xl font-semibold mb-8" id="current-sem-title">Semester 1 — Courses</h2>
                        <div id="course-grid" class="space-y-10">
                            </div>
                    </div>
                </div>
            </div>

            <div id="tab-viewer" class="tab-content hidden h-full">
                <div id="reader-frame" class="w-full h-full flex flex-col items-center justify-center bg-gray-50 rounded-2xl text-gray-400">
                    <i class="ti ti-file-search text-5xl mb-4 opacity-20"></i>
                    <p>Select a lecture from the Library to begin</p>
                </div>
            </div>

            <div id="tab-ai" class="tab-content hidden max-w-2xl mx-auto h-full flex flex-col">
                <div class="flex-1 bg-white border border-gray-100 rounded-3xl shadow-sm flex flex-col overflow-hidden h-[600px]">
                    <div id="ai-messages" class="flex-1 p-8 overflow-y-auto space-y-6 bg-slate-50/30">
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl rounded-tl-none text-sm text-gray-700 shadow-sm leading-relaxed">
                            Hello Abdihafid! I'm synced with your Year 3 Semester 2 data. How can I help with Biostatistics or R Programming today?
                        </div>
                    </div>
                    <div class="p-5 border-t border-gray-50 flex gap-4">
                        <input type="text" id="ai-input" placeholder="Ask a statistics question..." class="flex-1 py-3 px-5 outline-none text-sm bg-gray-50 rounded-xl" onkeydown="if(event.key==='Enter')sendChat()">
                        <button onclick="sendChat()" class="bg-[#185FA5] text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md"><i class="ti ti-send"></i></button>
                    </div>
                </div>
            </div>

            <div id="tab-calc" class="tab-content hidden max-w-md mx-auto">
                <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl">
                    <div class="text-right mb-6 px-2">
                        <div id="calc-expr" class="text-slate-500 text-xs h-4 mb-1"></div>
                        <div id="calc-display" class="text-4xl font-light text-white">0</div>
                    </div>
                    <div class="grid grid-cols-4 gap-3">
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcClear()">AC</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-700" onclick="calcOp('/')">/</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-700" onclick="calcOp('*')">×</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-700" onclick="calcOp('-')">−</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('7')">7</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('8')">8</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('9')">9</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-700" onclick="calcOp('+')">+</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('4')">4</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('5')">5</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('6')">6</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-[#185FA5] row-span-2 font-bold" onclick="calcEquals()">=</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('1')">1</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('2')">2</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('3')">3</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800 col-span-2" onclick="calcNum('0')">0</button>
                        <button class="calc-btn text-white p-4 rounded-xl bg-slate-800" onclick="calcNum('.')">.</button>
                    </div>
                </div>
            </div>

            <div id="tab-tables" class="tab-content hidden max-w-xl mx-auto">
                <div class="bg-gray-50 border border-gray-100 p-10 rounded-3xl">
                    <h3 class="text-center font-semibold mb-8">Statistical Distribution Lookup</h3>
                    <div class="space-y-6">
                        <select id="dist-type" class="w-full p-4 rounded-xl border border-gray-200 outline-none text-sm">
                            <option value="z">Z-Normal (Two-tailed)</option>
                            <option value="t">T-Student</option>
                            <option value="f">F-Snedecor</option>
                        </select>
                        <button onclick="calcDist()" class="w-full bg-[#185FA5] text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-100">Find Critical Value</button>
                        <div id="dist-result" class="text-center text-5xl font-bold text-[#185FA5] mt-6"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // SYSTEM CONFIG
        const SUPA_URL = 'https://dedyworlrfalwoujwkyx.supabase.co';
        const SUPA_KEY = 'sb_publishable_iqOfs6uyLmIV7PSmuOdHuQ_IXe_Fc88';
        const BUCKET = 'course-materials';
        const GEMINI_KEY = 'AIzaSyDtZVpDaz54wVBAjZnHCnO_-Ex8b9q5bCE';

        const CURRICULUM = {
            6: ["Biostatistics", "Data Computing R", "Data Stuctures & Algorithm", "Experimental Design", "Research Methadology", "Time Series"]
        };

        // UI NAVIGATION
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('btn-' + id).classList.add('nav-active');
        }

        function setSemester(num) {
            document.querySelectorAll('#sem-nav button').forEach(b => b.classList.remove('sem-active', 'bg-blue-50'));
            document.getElementById('sem-' + num).classList.add('sem-active');
            document.getElementById('current-sem-title').innerText = `Semester ${num} — Courses`;
            renderCourses(num);
        }

        async function renderCourses(semNum) {
            const grid = document.getElementById('course-grid');
            grid.innerHTML = '<div class="text-gray-300 animate-pulse">Syncing library...</div>';
            
            const files = await fetchFiles();
            const semesterCourses = CURRICULUM[semNum] || ["General Materials"];

            grid.innerHTML = semesterCourses.map(course => {
                // Logic to find files that match the course name in your Supabase folders
                const courseFiles = files.filter(f => f.name.toLowerCase().includes(course.toLowerCase()));
                return `
                    <div class="group">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-semibold text-gray-800">${course}</h3>
                            <span class="text-[10px] text-gray-300 font-bold uppercase tracking-wider">${courseFiles.length} files</span>
                        </div>
                        <div class="space-y-1">
                            ${courseFiles.length > 0 ? courseFiles.map(f => `
                                <div onclick="openReader('${f.name}')" class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 cursor-pointer group/item transition-all border border-transparent hover:border-gray-100">
                                    <div class="flex items-center gap-3">
                                        <i class="ti ti-file-text text-[#185FA5]"></i>
                                        <span class="text-sm text-gray-600 font-medium">${f.name}</span>
                                    </div>
                                    <i class="ti ti-chevron-right text-gray-300 opacity-0 group-hover/item:opacity-100 transition-all"></i>
                                </div>
                            `).join('') : '<p class="text-xs text-gray-300 italic px-3">No resources found in this folder yet.</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchFiles() {
            try {
                const r = await fetch(`${SUPA_URL}/storage/v1/object/list/${BUCKET}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prefix: 'Year3-Semester2/', limit: 100 })
                });
                return await r.json();
            } catch (e) { return []; }
        }

        function openReader(name) {
            const url = `${SUPA_URL}/storage/v1/object/public/${BUCKET}/Year3-Semester2/${encodeURIComponent(name)}`;
            document.getElementById('reader-frame').innerHTML = `<iframe src="${url}" class="w-full h-full rounded-2xl"></iframe>`;
            showTab('viewer');
        }

        // SEMESTER BUILDER
        const nav = document.getElementById('sem-nav');
        for(let i=1; i<=8; i++) {
            const btn = document.createElement('button');
            btn.id = `sem-${i}`;
            btn.className = "text-left px-4 py-2 rounded-lg text-sm text-gray-500 hover:text-[#185FA5] transition-all";
            btn.innerText = `Semester ${i}`;
            btn.onclick = () => setSemester(i);
            nav.appendChild(btn);
        }

        // AI ASSISTANT (GEMINI)
        async function sendChat() {
            const input = document.getElementById('ai-input');
            const box = document.getElementById('ai-messages');
            if(!input.value.trim()) return;

            const text = input.value;
            input.value = '';
            box.innerHTML += `<div class="bg-[#185FA5] text-white p-5 rounded-2xl rounded-tr-none text-sm self-end max-w-[85%] ml-auto shadow-sm">${text}</div>`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Explain this clearly for a statistics student: " + text }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="bg-white border border-gray-100 p-5 rounded-2xl rounded-tl-none text-sm text-gray-700 shadow-sm leading-relaxed">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            } catch (e) { box.innerHTML += `<div class="text-red-400 text-xs">Offline error.</div>`; }
        }

        // CALCULATOR ENGINE
        let expr = '';
        function calcNum(n) { expr += n; updateCalc(); }
        function calcOp(o) { expr += o; updateCalc(); }
        function calcClear() { expr = ''; updateCalc(); }
        function updateCalc() { document.getElementById('calc-display').innerText = expr || '0'; }
        function calcEquals() { try { expr = eval(expr).toString(); updateCalc(); } catch(e) { expr = 'Error'; updateCalc(); expr = ''; } }

        function calcDist() { document.getElementById('dist-result').innerText = '1.960'; }

        // BOOTSTRAP
        setSemester(6); // Defaults to Year 3 Semester 2 based on your curriculum
    </script>
</body>
</html>
